services:
  api:
    build: .
    ports:
      - "3333:3333"
    env_file:
      - path: .env
        required: false
    environment:
      # Sem TURSO_DATABASE_URL no .env, usa SQLite local em um volume Docker.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/app/data/biblioteca.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-biblioteca-jwt-secret}
      PORT: 3333
    volumes:
      - .:/app
      - /app/node_modules
      - biblioteca_data:/app/data
    command: >
      sh -c "
        npm run db:migrate &&
        npm run db:seed &&
        node server.js
      "

volumes:
  biblioteca_data:
