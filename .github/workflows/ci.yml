name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários
        run: npm run test:unit

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Usa SQLite em memória e exercita a camada real de models/CRUD.
      - name: Executar testes de integração
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Instala apenas dependências de produção, como o Render faria.
      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      # API Express não tem bundler: o "build" valida que a aplicação carrega
      # (rotas, controllers, services, models e configurações) sem erros.
      - name: Validar carregamento da aplicação
        run: npm run build

  smoke:
    name: Smoke test (API + Turso local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, integration]
    env:
      TURSO_DATABASE_URL: 'file:./ci.db'
      JWT_SECRET: ci-secret
      NODE_ENV: test
      PORT: '3333'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar schema e seed
        run: npm run db:setup

      - name: Subir a API e validar o fluxo principal
        run: |
          node server.js > server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Log da API:"
              cat server.log
            fi
            kill "$SERVER_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3333/api/health > health.json; then
              echo "Health check OK:"
              cat health.json
              break
            fi
            echo "Tentativa $attempt/30: API ainda não respondeu..."
            sleep 1
            if [ "$attempt" -eq 30 ]; then
              echo "API não respondeu a tempo."
              exit 1
            fi
          done

          npm run smoke

  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit, integration, build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Opcional: só executa de fato se o secret estiver configurado.
      # Para o CI controlar o deploy, desabilite o Auto-Deploy no Render.
      - name: Disparar deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Secret RENDER_DEPLOY_HOOK_URL não configurado; deploy pelo Actions ignorado."
            exit 0
          fi

          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy disparado no Render."
